[package]
name = "koris-tauri"
version = "0.1.0"
description = "koris desktop app (Tauri shell around the koris agent server + web dashboard)"
authors = ["guilhermesalviano <koaris.project@gmail.com>"]
license = "ISC"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
