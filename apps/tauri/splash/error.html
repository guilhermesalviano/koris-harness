<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>koris — startup failed</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0e0e10;
        color: #e7e7e7;
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
        padding: 3rem;
        box-sizing: border-box;
      }
      h1 {
        color: #f36246;
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #17171a;
        border: 1px solid #2a2a2e;
        border-radius: 8px;
        padding: 1rem;
        color: #c9c9c9;
        font-size: 0.8rem;
        max-height: 55vh;
        overflow: auto;
      }
      p { color: #8a8a8a; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <h1>koris desktop — startup failed</h1>
    <pre id="message"></pre>
    <p>
      The koris server failed to start. Check the logs in your data directory
      (<code>logs/</code>), then relaunch the app.
    </p>
    <script>
      // textContent, never innerHTML: the message is a raw stderr tail.
      const params = new URLSearchParams(window.location.search);
      document.getElementById('message').textContent =
        params.get('message') || 'The server exited before reporting a port.';
    </script>
  </body>
</html>
