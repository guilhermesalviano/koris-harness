<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>koris</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0e0e10;
        color: #e7e7e7;
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wordmark {
        font-size: 2rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .wordmark span { color: #f36246; }
      .status {
        font-size: 0.85rem;
        color: #8a8a8a;
      }
      .dots::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }
    </style>
  </head>
  <body>
    <div class="wordmark">koris<span>.</span></div>
    <div class="status">Starting the agent server<span class="dots"></span></div>
  </body>
</html>
