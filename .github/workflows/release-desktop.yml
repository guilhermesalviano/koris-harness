name: Release Desktop

# Builds the Electron desktop app for macOS / Windows / Linux and uploads the
# installers as assets on the GitHub Release that triggered the run.
#
# Flow: `pnpm release <bump>` -> review -> commit -> `git tag vX.Y.Z` ->
# `git push --follow-tags` -> publish the Release for that tag in the GitHub UI
# (or `gh release create vX.Y.Z --generate-notes`). This workflow then attaches
# the executables to it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach assets to (e.g. v1.2.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: macos-14
            args: --mac --arm64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build server + web + desktop shell
        run: |
          pnpm build
          pnpm build:desktop

      - name: Stage bundled server deps
        run: pnpm desktop:stage

      - name: Generate app icons
        run: node apps/desktop/scripts/make-icons.mjs

      - name: Build installers
        run: node apps/desktop/scripts/package-desktop.mjs ${{ matrix.args }} --publish never
        env:
          KORIS_RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          # Empty until the repo secrets are added — builds stay unsigned.
          # macOS also needs `identity: null` removed from electron-builder.yml.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            dist-desktop-out/*.AppImage
            dist-desktop-out/*.deb
            dist-desktop-out/*.rpm
            dist-desktop-out/*.dmg
            dist-desktop-out/*.exe
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "${{ steps.ver.outputs.tag }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
